# Historical price datasets on data.gov.in, one resource per commodity-year.
#
# The main resource (settings.api.resource_id) is a CURRENT-DAY feed only:
# querying it for any past arrival_date returns zero rows. Multi-year history
# therefore has to come from these per-year archives.
#
# Their schema differs from the live feed and is normalised on ingest:
#   _state_      -> state
#   arrival_date -> ISO timestamp rather than DD/MM/YYYY
#   grade        -> absent entirely
#   update_date  -> dropped
resources:
