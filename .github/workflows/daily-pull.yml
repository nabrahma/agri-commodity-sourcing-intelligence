name: daily-pull

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST, after the morning price upload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pull today's prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m ingest.daily

      # This job accrues raw days and nothing else. It deliberately does NOT
      # run clean/warehouse/analytics: the runner has only the daily slice,
      # never the 2019-2023 archive, so rebuilding here would overwrite the
      # committed reports and dashboard inputs with one day of data. Those
      # are rebuilt locally, where the full landing zone lives.
      - name: Commit the new partitions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/source=api
          git diff --staged --quiet || git commit -m "data: daily pull $(date -u +%Y-%m-%d)"
          git push
